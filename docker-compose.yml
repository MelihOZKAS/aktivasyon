services:
  postgresfadil:
    container_name: postgresfadil
    hostname: postgresfadil
    image: postgres:latest
    env_file:
      - aktivasyon/docker.env
    ports:
      - "5434:5432"
    volumes:
      - "postgresql-data-fadil:/var/lib/postgresql/data"
    networks:
      - main_fadil
    command: -p 5434
  app_fadil:
    container_name: app_fadil
    hostname: app_fadil
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - aktivasyon/docker.env
    volumes:
      - static-data-fadil:/srv/public
      - .:/srv/app_fadil
    expose:
      - 8002
    depends_on:
      - postgresfadil
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8002 --workers 3 --timeout 60
    networks:
      - main_fadil
      - bridge_network

networks:
  main_fadil:
  bridge_network:
    # nginx container'ı ayrı bir stack'te; ağ orada oluşturuluyor.
    name: nginx_network
    external: true

volumes:
  postgresql-data-fadil:
  static-data-fadil: