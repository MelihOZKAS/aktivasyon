# Sunucudaki ortak nginx'in bu projeye ait parçası. nginx ayrı bir stack'te
# duruyor; bu blok oradaki dosyaya elle kopyalanır. `upstream fadil` orada
# zaten tanımlıysa ikinci kez eklenmez.
#
# İki alan adı aynı siteyi açar. Çıplak ad www'ye yönlenir. Yeni alan adı
# eklenirse docker.env'de ALLOWED_HOSTS ve CSRF_TRUSTED_ORIGINS'e de yazılır.

upstream fadil {
    server app_fadil:8002;
}

server {
    listen 80;
    server_name aktivasyoncu.site;
    return 301 $scheme://www.aktivasyoncu.site$request_uri;
}

server {
    listen 80;
    server_name aktivasyoncu.com.tr;
    return 301 $scheme://www.aktivasyoncu.com.tr$request_uri;
}

server {
    listen 80;
    server_name www.aktivasyoncu.site www.aktivasyoncu.com.tr;
    server_tokens off;
    client_max_body_size 20M;
    location / {
        proxy_pass http://fadil;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
