upstream Nasip_fadil {
    server app_fadil:8000;
}

# Django HTTPS'i X-Forwarded-Proto'dan anlar (prod.py SECURE_PROXY_SSL_HEADER).
# Önde başka bir proxy (Cloudflare vb.) varsa onun söylediği geçer, yoksa
# bu nginx'in kendi şeması.
map $http_x_forwarded_proto $aktivasyon_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# İki alan adı da aynı siteyi açar: aktivasyoncu.site ve aktivasyoncu.com.tr,
# çıplak ve www. Yeni alan adı eklenirse docker.env'de ALLOWED_HOSTS ve
# CSRF_TRUSTED_ORIGINS'e de yazılır.
server {
    listen 80;
    server_name aktivasyoncu.site www.aktivasyoncu.site aktivasyoncu.com.tr www.aktivasyoncu.com.tr;
    server_tokens off;
    client_max_body_size 20M;
    location / {
        proxy_pass http://Nasip_fadil;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $aktivasyon_proto;
        proxy_set_header Host $host;
        proxy_redirect off;
    }
}
