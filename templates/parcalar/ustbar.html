{% load panel %}
<header class="sticky top-0 z-20 flex items-center gap-3 border-b border-cizgi
               bg-zemin/90 px-5 py-3 backdrop-blur lg:px-9">

  <button type="button" data-menu-ac aria-label="Menüyü aç"
          class="dugme dugme-sessiz px-2.5 py-2 lg:hidden">
    <svg width="20" height="20" viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>

  {# Kimin hesabıyla çalışıldığı her ekranda görünsün. #}
  <div class="min-w-0 flex-1">
    {% if user.bayi_profili.unvan %}
    <p class="truncate font-medium leading-tight">{{ user.bayi_profili.unvan }}</p>
    <p class="truncate text-xs text-soluk">{{ user.get_username }}</p>
    {% else %}
    <p class="truncate font-medium">{{ user.get_full_name|default:user.get_username }}</p>
    {% endif %}
  </div>


  <form method="post" action="{% url 'bayi:cikis' %}">
    {% csrf_token %}
    <button type="submit" class="dugme dugme-sessiz text-sm">Çıkış</button>
  </form>
</header>
