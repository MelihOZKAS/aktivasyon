{% load panel %}
<header class="sticky top-0 z-20 flex items-center gap-3 border-b border-cizgi
               bg-zemin/90 px-5 py-3 backdrop-blur lg:px-9">

  <button type="button" data-menu-ac aria-label="Menüyü aç"
          class="dugme dugme-sessiz px-2.5 py-2 lg:hidden">
    <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>

  <div class="flex-1"></div>


  <form method="post" action="{% url 'bayi:cikis' %}">
    {% csrf_token %}
    <button type="submit" class="dugme dugme-sessiz text-sm">Çıkış</button>
  </form>
</header>
