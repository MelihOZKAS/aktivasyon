<label for="id_kampanya" class="alan-etiketi mb-1.5 block">
  Kampanya <span class="font-normal text-kagit-500">— varsa</span>
</label>
<select name="kampanya" id="id_kampanya" class="girdi">
  <option value="">{% if kampanyalar %}Kampanyasız devam et{% else %}Bu tarifede kampanya yok{% endif %}</option>
  {% for kampanya in kampanyalar %}
  <option value="{{ kampanya.pk }}"
          {% if secili|stringformat:'s' == kampanya.pk|stringformat:'s' %}selected{% endif %}>
    {{ kampanya.ad }}
  </option>
  {% endfor %}
</select>
