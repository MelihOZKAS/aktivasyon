<label for="id_tarife" class="alan-etiketi mb-1.5 block">Tarife</label>
<select name="tarife" id="id_tarife" class="girdi"
        hx-get="{% url 'basvurular:kampanyalar' %}"
        hx-target="#kampanya-kutusu"
        hx-trigger="change">
  <option value="">{% if tarifeler %}Seçiniz{% else %}Önce operatör seç{% endif %}</option>
  {% for tarife in tarifeler %}
  <option value="{{ tarife.pk }}"
          {% if secili|stringformat:'s' == tarife.pk|stringformat:'s' %}selected{% endif %}>
    {{ tarife.ad }}
  </option>
  {% endfor %}
</select>
