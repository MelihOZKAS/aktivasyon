{% load static panel %}<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{% block baslik %}Aktivasyon{% endblock %}</title>


  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'app.css' %}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.4/htmx.min.js" defer></script>
</head>

<body class="min-h-dvh">
<div class="lg:grid lg:grid-cols-[16rem_1fr] min-h-dvh">

  {% include "parcalar/kenar.html" %}

  <div class="flex min-h-dvh flex-col">
    {% include "parcalar/ustbar.html" %}

    <main class="flex-1 bg-yuzey px-5 py-7 lg:px-9 lg:py-10">
      {% if messages %}
        <div class="mb-6 space-y-2">
          {% for mesaj in messages %}
            <div class="yuzey sim rounded-kart px-4 py-3 text-sm
                        {% if 'error' in mesaj.tags %}border-olumsuz/40 text-olumsuz
                        {% elif 'success' in mesaj.tags %}border-olumlu/40 text-olumlu{% endif %}">
              {{ mesaj }}
            </div>
          {% endfor %}
        </div>
      {% endif %}

      {% block icerik %}{% endblock %}
    </main>
  </div>
</div>

<script>
  (function () {
    var menu = document.getElementById("kenar-menu");
    var perde = document.getElementById("menu-perde");
    var acanDugme = null;

    function acik() {
      return !menu.classList.contains("-translate-x-full");
    }

    function ac(dugme) {
      acanDugme = dugme || null;
      menu.classList.remove("-translate-x-full");
      perde.hidden = false;
      document.body.style.overflow = "hidden";
      var ilkBaglanti = menu.querySelector("a, button");
      if (ilkBaglanti) ilkBaglanti.focus();
    }

    function kapat() {
      menu.classList.add("-translate-x-full");
      perde.hidden = true;
      document.body.style.overflow = "";
      if (acanDugme) acanDugme.focus();
      acanDugme = null;
    }

    document.addEventListener("click", function (olay) {
      var acDugmesi = olay.target.closest("[data-menu-ac]");
      if (acDugmesi) return ac(acDugmesi);
      if (olay.target.closest("[data-menu-kapat]") || olay.target === perde) kapat();
    });

    document.addEventListener("keydown", function (olay) {
      if (olay.key === "Escape" && acik()) kapat();
    });

    // Masaüstüne genişlerken çekmece açık kalmasın.
    var genisEkran = matchMedia("(min-width: 1024px)");
    genisEkran.addEventListener("change", function (e) {
      if (e.matches && acik()) kapat();
    });
  })();
</script>
{% block betik %}{% endblock %}
</body>
</html>
