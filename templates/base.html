{% load static panel %}<!doctype html>
<html lang="tr" class="{{ tema_sinifi }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block baslik %}Aktivasyon{% endblock %}</title>

  <script>
    // Tema tercihini boyamadan önce uygula ki ekran titremesin.
    (function () {
      try {
        var secim = localStorage.getItem("tema");
        var koyu = secim ? secim === "koyu"
                         : matchMedia("(prefers-color-scheme: dark)").matches;
        if (koyu) document.documentElement.classList.add("dark");
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400,0,0&display=block" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'app.css' %}">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/htmx/2.0.4/htmx.min.js" defer></script>
</head>

<body class="min-h-dvh">
<div class="lg:grid lg:grid-cols-[16rem_1fr] min-h-dvh">

  {% include "parcalar/kenar.html" %}

  <div class="flex min-h-dvh flex-col">
    {% include "parcalar/ustbar.html" %}

    <main class="flex-1 px-5 py-7 lg:px-9 lg:py-9">
      {% if messages %}
        <div class="mb-6 space-y-2">
          {% for mesaj in messages %}
            <div class="yuzey sim rounded-kart px-4 py-3 text-sm
                        {% if 'error' in mesaj.tags %}border-olumsuz/40 text-olumsuz
                        {% elif 'success' in mesaj.tags %}border-olumlu/40 text-olumlu{% endif %}">
              {{ mesaj }}
            </div>
          {% endfor %}
        </div>
      {% endif %}

      {% block icerik %}{% endblock %}
    </main>
  </div>
</div>

<script>
  document.addEventListener("click", function (olay) {
    var dugme = olay.target.closest("[data-tema-degistir]");
    if (!dugme) return;
    var koyuydu = document.documentElement.classList.toggle("dark");
    try { localStorage.setItem("tema", koyuydu ? "koyu" : "acik"); } catch (e) {}
  });

  document.addEventListener("click", function (olay) {
    var dugme = olay.target.closest("[data-menu-ac]");
    if (dugme) {
      document.getElementById("kenar-menu").classList.toggle("hidden");
    }
  });
</script>
{% block betik %}{% endblock %}
</body>
</html>
